version: '3.8'

networks:
  joshper-network:
    driver: bridge

volumes:
  postgres_data:
  app_uploads:
  backup_data:

services:
  database:
    container_name: joshper-db
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-joshperdb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    networks:
      - joshper-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-joshperdb}"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  application:
    container_name: joshper-app
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@database:5432/${DB_NAME:-joshperdb}
      IMAGES_URL: ${IMAGES_URL:-http://images:80}
      APP_URL: ${APP_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      UPLOAD_MAX_SIZE: "5242880"
      ALLOWED_MIME_TYPES: "image/jpeg,image/png,image/webp,application/pdf"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - app_uploads:/app/uploads:rw
      - ./logs:/app/logs:rw
    depends_on:
      - database
    networks:
      - joshper-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  images:
    container_name: joshper-images
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - app_uploads:/usr/share/nginx/html/uploads:ro
      - ./nginx/nginx-images.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - application
    networks:
      - joshper-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  proxy:
    container_name: joshper-proxy
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - application
      - images
    networks:
      - joshper-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  backup:
    container_name: joshper-backup
    image: postgres:16
    volumes:
      - backup_data:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    environment:
      DB_HOST: database
      DB_USER: ${DB_USER:-postgres}
      DB_NAME: ${DB_NAME:-joshperdb}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    command: ["/bin/sh","-c","echo 'Backup service ready' && tail -f /dev/null"]
    networks:
      - joshper-network
    depends_on:
      - database
    restart: unless-stopped
    profiles:
      - backup
