# ==============================================================================
# JOSHPER SOLUTIONS - CONFIGURACIÓN NGINX PROXY CON SSL / HTTPS (PUERTO 443)
# ==============================================================================
# Reemplazar DOMINIO_AQUI con tu dominio real (ej: tu-dominio.com)

upstream app_backend {
    server application:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=uploads:10m rate=20r/s;

# 1. Redirección de HTTP (80) a HTTPS (443)
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO_AQUI www.DOMINIO_AQUI;

    # Para verificación del desafío ACME de Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor seguro HTTPS (443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMINIO_AQUI www.DOMINIO_AQUI;

    # Certificados SSL / Let's Encrypt
    ssl_certificate /etc/nginx/ssl/live/DOMINIO_AQUI/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/DOMINIO_AQUI/privkey.pem;

    # Parámetros y Cifrados SSL Recomendados (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Encabezados de Seguridad Adicionales
    server_tokens off;
    client_max_body_size 10M;
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Health check
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "proxy_healthy_https\n";
    }

    # Bloquear ejecutables en uploads
    location ~* ^/uploads/.*\.(php|exe|sh|bat|cmd|jar|pif|scr|msi|com|vb|js|html?)$ {
        return 404;
    }

    # Archivos estáticos - Servidos directamente desde el volumen compartido
    location /uploads/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        autoindex off;
        limit_req zone=uploads burst=30 nodelay;
        limit_except GET HEAD OPTIONS { deny all; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }

    # Rutas API - Dirigidas al contenedor Next.js
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Rutas Frontend Aplicación
    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
