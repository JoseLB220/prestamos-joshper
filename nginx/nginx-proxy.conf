# Configuración principal del proxy
upstream app_backend {
    server application:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream images_backend {
    server images:80 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Cache para API y assets
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m 
                 inactive=60m use_temp_path=off;

# Servidor principal
server {
    listen 80 default_server;
    server_name _;

    # Use Docker DNS resolver to allow nginx to resolve service names at runtime
    # (127.0.0.11 is Docker's embedded DNS server)
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    # Configuración de seguridad global
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Tamaño máximo de peticiones
    client_max_body_size 10M;

    # Optimizaciones globales
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Health check interno
    location /health {
        access_log off;
        return 200 "proxy_healthy\n";
        add_header Content-Type text/plain;
    }

    # RUTAS DE API - Dirigidas a joshper-app
    location /api/ {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Cache para respuestas API
        location ~* /api/(auth|health) {
            proxy_cache off;
        }

        location ~* /api/.* {
            proxy_cache api_cache;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 302 5m;
            proxy_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Rate limiting para API
        limit_req zone=api burst=50 nodelay;
    }

    # RUTAS DE ARCHIVOS - Exclusivamente a joshper-images
    location /uploads/ {
        proxy_pass http://images_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optimizaciones para archivos estáticos
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 64 16k;
        proxy_max_temp_file_size 0;

        # Cache largo para archivos estáticos
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 302 24h;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Pragma "public";
        add_header Vary "Accept-Encoding";
    }

    # RUTAS DE APLICACIÓN - Dirigidas a joshper-app
    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuración de cache para assets estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # No cachear HTML y similares
        location ~* \.(html|json)$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;