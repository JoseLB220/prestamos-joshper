# Production images nginx config (copied from nginx-images.conf)
server {
    listen 80;
    server_name _;

    server_tokens off;
    autoindex off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; object-src 'none';" always;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    add_header 'Access-Control-Max-Age' 86400 always;

    location /health {
        access_log off;
        return 200 "images_healthy\n";
        add_header Content-Type text/plain;
    }

    location /uploads/ {
        root /usr/share/nginx/html;

        limit_except GET HEAD OPTIONS {
            deny all;
        }

        location ~* \.(jpg|jpeg|png|gif|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            types { 
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
            }
            default_type application/octet-stream;
        }

        location ~* \.(pdf)$ {
            expires 6M;
            add_header Cache-Control "public";
            types {
                application/pdf pdf;
            }
            default_type application/octet-stream;
        }

        location ~* \.(php|exe|sh|bat|cmd|jar|pif|scr|msi|com|vb|js|html?)$ {
            deny all;
            return 404;
        }

        valid_referers none blocked server_names;
        if ($invalid_referer) {
            return 403;
        }

        limit_req zone=images burst=20 nodelay;
        limit_req_status 429;
    }

    location / {
        deny all;
        return 403;
    }
}

limit_req_zone $binary_remote_addr zone=images:10m rate=10r/s;
